<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>G2 Connect - Application Finale</title>
<script>
  // Attrape-erreurs de secours : s'exécute avant tout le reste, affiche
  // n'importe quelle erreur directement sur la page si l'app ne démarre pas.
  (function(){
    var shown=false;
    function showErr(msg,src,line,col,err){
      if(shown)return;shown=true;
      var box=document.createElement('div');
      box.style.cssText='position:fixed;inset:0;background:#1a1a2e;color:#fff;font-family:monospace;font-size:13px;padding:24px;z-index:999999;overflow:auto;white-space:pre-wrap;box-sizing:border-box';
      var stack=(err&&err.stack)?err.stack:'';
      box.textContent='ERREUR AU CHARGEMENT DE G2 CONNECT\n\n'+String(msg)+'\n\nFichier: '+String(src||'?')+' ligne '+String(line||'?')+':'+String(col||'?')+'\n\n'+stack;
      function attach(){document.body.appendChild(box);}
      if(document.body)attach();else document.addEventListener('DOMContentLoaded',attach);
    }
    window.addEventListener('error',function(e){showErr(e.message,e.filename,e.lineno,e.colno,e.error);});
    window.addEventListener('unhandledrejection',function(e){showErr('Promesse rejetée: '+(e.reason&&e.reason.message||e.reason),'',0,0,e.reason);});
  })();
</script>

<link rel="stylesheet" href="/G2/styles.css">
<link rel="manifest" href="/G2/manifest.json">
<meta name="theme-color" content="#001a8d">
<!-- Balises requises par iOS/Safari pour que l'ajout à l'écran d'accueil
     fonctionne comme une vraie PWA (nécessaire pour les notifications push
     quand l'application est fermée, depuis iOS 16.4) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="G2 Connect">

  // Cache-busting automatique : force le navigateur à toujours récupérer
  // la dernière version de app.js, sans jamais avoir besoin de vider le
